[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "souk"
version = "0.1.0"
description = "Open-source benchmark for evaluating EC product recommendation chat quality"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "NITI Lab" },
]
keywords = [
    "chat", "evaluation", "llm", "benchmark", "ecommerce",
    "recommendation", "naturalness", "security",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openai>=1.0.0",
    "anthropic>=0.30.0",
    "google-generativeai>=0.5.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
mcp = ["mcp[cli]>=1.0.0"]
bedrock = ["boto3>=1.34.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]
all = ["souk[mcp,bedrock,dev]"]

[project.scripts]
souk = "chat_eval.cli:main"

[project.urls]
Homepage = "https://github.com/NITI-Lab/SOUK"
Repository = "https://github.com/NITI-Lab/SOUK"
Issues = "https://github.com/NITI-Lab/SOUK/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/chat_eval"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
